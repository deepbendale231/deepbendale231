<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='383' viewBox='0 0 1200 383' font-family='Helvetica Neue,Helvetica,Arial,sans-serif'><defs><linearGradient id='g' x1='0' x2='1'><stop offset='0' stop-color='#A855F7'/><stop offset='1' stop-color='#00E5FF'/></linearGradient><radialGradient id='o' cx='.5' cy='.5' r='.5'><stop offset='0' stop-color='#A855F7' stop-opacity='.22'/><stop offset='1' stop-color='#A855F7' stop-opacity='0'/></radialGradient><clipPath id='c'><rect width='1200' height='383' rx='18'/></clipPath></defs><rect width='1200' height='383' rx='18' fill='#0D0D14'/><g clip-path='url(#c)'><circle cx='1080' cy='40' r='260' fill='url(#o)'/></g><rect x='.5' y='.5' width='1199' height='382' rx='18' fill='none' stroke='#ffffff14'/><text x='40' y='56' fill='#8B8B9C' font-size='11' letter-spacing='3' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>ABOUT</text><text x='40' y='92' fill='#EEEEF4' font-size='26' font-weight='800' letter-spacing='-.5'>I build systems <tspan fill='url(#g)'>that ship.</tspan></text><rect x='40' y='104' width='90' height='3' rx='1.5' fill='url(#g)'/><text x='40' y='140' fill='#B7B7C6' font-size='15'>I'm an Applied AI Engineer from Mumbai, and I like building real systems end to end.</text><text x='40' y='163' fill='#B7B7C6' font-size='15'>Right now I lead the cloud-sync feature for Ainsemble's DAW plugin: a cross-platform</text><text x='40' y='186' fill='#B7B7C6' font-size='15'>C++ plugin that syncs a producer's projects to the cloud, owned from requirements to</text><text x='40' y='209' fill='#B7B7C6' font-size='15'>release.</text><text x='40' y='255' fill='#B7B7C6' font-size='15'>Day to day that means architecture decisions, testing inside real DAW hosts, and</text><text x='40' y='278' fill='#B7B7C6' font-size='15'>shipping Windows and macOS installers.</text><text x='40' y='324' fill='#B7B7C6' font-size='15'>I also love working with data. Credit risk models, RAG assistants and analytics APIs</text><text x='40' y='347' fill='#B7B7C6' font-size='15'>are how I learn what a good system needs underneath. I'm a B.Tech IT student at DJSCE,</text><text x='40' y='370' fill='#B7B7C6' font-size='15'>Mumbai.</text><path d='M790 48V335' stroke='#ffffff14'/><circle cx='820' cy='66' r='4' fill='#A855F7'/><text x='836' y='69' fill='#5B5B6B' font-size='10.5' letter-spacing='2' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>LOCATION</text><text x='836' y='94' fill='#EEEEF4' font-size='15' font-weight='600'>Mumbai, India</text><circle cx='820' cy='143' r='4' fill='#00E5FF'/><text x='836' y='146' fill='#5B5B6B' font-size='10.5' letter-spacing='2' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>BUILDING</text><text x='836' y='171' fill='#EEEEF4' font-size='15' font-weight='600'>Cloud-sync plugin · C++ / JUCE</text><circle cx='820' cy='221' r='4' fill='#A855F7'/><text x='836' y='224' fill='#5B5B6B' font-size='10.5' letter-spacing='2' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>ALSO LOVE</text><text x='836' y='249' fill='#EEEEF4' font-size='15' font-weight='600'>Credit risk · RAG · analytics APIs</text><circle cx='820' cy='298' r='4' fill='#00E5FF'/><text x='836' y='301' fill='#5B5B6B' font-size='10.5' letter-spacing='2' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>STATUS</text><text x='836' y='326' fill='#EEEEF4' font-size='15' font-weight='600'>Open to freelance and full-time</text></svg>