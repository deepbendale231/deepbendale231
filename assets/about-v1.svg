<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='360' viewBox='0 0 1200 360' font-family='Helvetica Neue,Helvetica,Arial,sans-serif'><defs><linearGradient id='g' x1='0' x2='1'><stop offset='0' stop-color='#A855F7'/><stop offset='1' stop-color='#00E5FF'/></linearGradient><radialGradient id='o' cx='.5' cy='.5' r='.5'><stop offset='0' stop-color='#A855F7' stop-opacity='.22'/><stop offset='1' stop-color='#A855F7' stop-opacity='0'/></radialGradient><clipPath id='c'><rect width='1200' height='360' rx='18'/></clipPath></defs><rect width='1200' height='360' rx='18' fill='#0D0D14'/><g clip-path='url(#c)'><circle cx='1080' cy='40' r='260' fill='url(#o)'/></g><rect x='.5' y='.5' width='1199' height='359' rx='18' fill='none' stroke='#ffffff14'/><text x='40' y='56' fill='#8B8B9C' font-size='11' letter-spacing='3' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>ABOUT</text><text x='40' y='92' fill='#EEEEF4' font-size='26' font-weight='800' letter-spacing='-.5'>Data into decisions, <tspan fill='url(#g)'>end to end.</tspan></text><rect x='40' y='104' width='90' height='3' rx='1.5' fill='url(#g)'/><text x='40' y='140' fill='#B7B7C6' font-size='15'>I'm an Applied AI Engineer and Data Scientist from Mumbai. I like problems where data</text><text x='40' y='163' fill='#B7B7C6' font-size='15'>has to become a decision someone can trust: a credit policy that explains itself, an</text><text x='40' y='186' fill='#B7B7C6' font-size='15'>assistant that points to its source, a dashboard that replaces a weekly spreadsheet.</text><text x='40' y='232' fill='#B7B7C6' font-size='15'>I build the whole path, from cleaning the data and validating the model to the API,</text><text x='40' y='255' fill='#B7B7C6' font-size='15'>the interface and the deploy. I also write C++ audio plugins, which keeps me honest</text><text x='40' y='278' fill='#B7B7C6' font-size='15'>about performance and how software behaves in the real world.</text><text x='40' y='324' fill='#B7B7C6' font-size='15'>I'm a B.Tech student in Information Technology at DJSCE, Mumbai, and currently lead a</text><text x='40' y='347' fill='#B7B7C6' font-size='15'>cloud-sync feature for a DAW plugin during my internship.</text><path d='M790 48V312' stroke='#ffffff14'/><circle cx='820' cy='66' r='4' fill='#A855F7'/><text x='836' y='69' fill='#5B5B6B' font-size='10.5' letter-spacing='2' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>LOCATION</text><text x='836' y='94' fill='#EEEEF4' font-size='15' font-weight='600'>Mumbai, India</text><circle cx='820' cy='137' r='4' fill='#00E5FF'/><text x='836' y='140' fill='#5B5B6B' font-size='10.5' letter-spacing='2' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>EDUCATION</text><text x='836' y='165' fill='#EEEEF4' font-size='15' font-weight='600'>B.Tech IT · DJSCE · CGPA 9.00</text><circle cx='820' cy='207' r='4' fill='#A855F7'/><text x='836' y='210' fill='#5B5B6B' font-size='10.5' letter-spacing='2' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>FOCUS</text><text x='836' y='235' fill='#EEEEF4' font-size='15' font-weight='600'>Credit risk · RAG · analytics APIs</text><circle cx='820' cy='278' r='4' fill='#00E5FF'/><text x='836' y='281' fill='#5B5B6B' font-size='10.5' letter-spacing='2' font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace'>STATUS</text><text x='836' y='306' fill='#EEEEF4' font-size='15' font-weight='600'>Open to freelance and full-time</text></svg>